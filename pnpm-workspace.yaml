# Post-install build scripts are disabled for native packages.
# Prisma engines are generated explicitly via `pnpm db:generate`,
# and sharp/unrs-resolver binaries are provided by the runtime.
overrides:
  # @tiptap/pm@3.31.4 résout prosemirror-view 1.42.6 / model 1.25.12 alors que les
  # autres paquets prosemirror restent sur 1.41.8 / 1.25.4 : deux versions de la
  # même bibliothèque dans le bundle de l'éditeur (~24 KB gzip en double).
  "prosemirror-view": "1.42.6"
  "prosemirror-model": "1.25.12"

  sharp: ">=0.35.0"
  nanoid: ">=3.3.16"
  browserslist: ">=4.28.7"
  mysql2: ">=3.22.0"
  smol-toml: ">=1.7.1"
  brace-expansion: ">=5.0.12"
  undici: ">=6.27.0"
  postcss: ">=8.5.12"
  js-yaml: "^4.3.2"
  depcheck>js-yaml: "^3.15.2"
  uuid: "^11.1.1"
  "@babel/core": "^7.29.6"
  postcss-selector-parser: "^6.1.3"
allowBuilds:
  '@prisma/client': false
  '@prisma/engines': false
  prisma: false
  sharp: false
  unrs-resolver: false
